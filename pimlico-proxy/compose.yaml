# Container packaging for pimlico-proxy. Behaviour is unchanged: same image, same
# entrypoint, same variables. Nothing here sets a variable value -- `.env` is the
# operator's file, and the same one the bare-metal path uses.
services:
  proxy:
    build: .
    image: pimlico-proxy:latest
    restart: unless-stopped

    # The operator's .env, read by Node at startup. Uncommented keys in it win
    # nothing here, because this file sets none. Never put the Pimlico key or the
    # JWT secret in this file: it is committed.
    env_file: .env

    # Loopback only. nginx on the host is the public edge and proxies to
    # 127.0.0.1:8080; nothing else should be able to reach the container directly.
    ports:
      - "127.0.0.1:8080:8080"

    # `index.ts` closes the server on SIGTERM and force-exits after 20 s, so 25 s
    # leaves Docker a margin before it resorts to SIGKILL.
    stop_grace_period: 25s

    # The service writes nothing to disk: a read-only root filesystem makes an
    # accidental write a crash rather than a silent side effect.
    read_only: true

    # No setuid binaries and no privilege gains from inside the container.
    security_opt:
      - no-new-privileges:true

    # The service logs one JSON line per event; cap the growth so a noisy
    # deployment cannot fill the host disk.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
