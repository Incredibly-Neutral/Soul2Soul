services:
  cid-mirror:
    build: .
    container_name: cid-mirror
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      # Bind-mount webcontent so host nginx can serve it
      - ./webcontent:/app/webcontent
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
