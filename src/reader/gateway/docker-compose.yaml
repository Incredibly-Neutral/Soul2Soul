version: "3.8"

services:
  ccip-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "2002:2002"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-2002}
      # DRPC (Base L2). The key comes from `.env` next to this file — never
      # inline it here. Copy .env.example → .env first.
      - BASE_RPC_URL=https://lb.drpc.live/base/${DRPC_API_KEY:?DRPC_API_KEY is not set — cp .env.example .env}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Uncomment to persist logs
    # volumes:
    #   - ./logs:/app/logs
    # Resource limits (adjust as needed)
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.25"
