# lastmile — configuration
# Copy to /etc/lastmile/config.toml on the server and edit.
# Every key shown is the default; the loader validates types and required fields.

# At least two independent Ethereum RPC endpoints are REQUIRED.
# Resolution only proceeds when ALL of them succeed AND agree (fail-closed).
rpc_urls = [
  "https://ethereum-rpc.provider-a.example/v1",
  "https://eth-mainnet.provider-b.example",
]

# How often to re-resolve every magazine (milliseconds). Default 60_000.
poll_interval_ms = 60_000

# How many old CIDs stay pinned for rollback. Default 5.
rollback_depth = 5

# Kubo (IPFS) node, API + gateway.
# The API is where lastmile pins. The gateway is what nginx proxies to;
# it only serves blocks already on the node (Gateway.NoFetch = true).
kubo_api_url     = "http://127.0.0.1:25011"
kubo_gateway_url = "http://127.0.0.1:28080"

# Commands run after rewriting an nginx include: validate, then reload.
# lastmile runs as root (it owns the reload); `sudo -n` guards against password prompts.
nginx_test_cmd   = "sudo -n nginx -t"
nginx_reload_cmd = "sudo -n nginx -s reload"

# Optional: a shell command run on every alert (the alert message is piped on stdin).
# alert_cmd = "/usr/local/bin/lastmile-alert.sh"

# One entry per magazine: a single .com domain bound to a single .eth name.
[[magazines]]
domain         = "s3ntiment.com"
ens_name       = "s3ntiment.eth"
nginx_include  = "/etc/nginx/lastmile/s3ntiment.conf"
state_dir      = "/var/lib/lastmile/s3ntiment"
# kubo_gateway_url = "http://127.0.0.1:28080"  # optional per-magazine override
# kubo_api_url     = "http://127.0.0.1:25011"  # optional per-magazine override
